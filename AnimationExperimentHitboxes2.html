async function loadAnimation(state, name){
const sheets=[]
for(let i=1; ;i++){
let source=`spriteSheets/${name}/${state}_${i}.png`
let img=await loadImage(source)

if(img===null){
break;
}
sheets.push(img)
}

return sheets
}

function loadImage(source){
return new Promise((resolve, reject)=>{
const img=new Image();
img.onload= async()=>{
await img.decode()
resolve(img)
}
img.onerror= ()=>{

console.warn(`Sprite not found: ${source}`)
resolve(null)
}
img.src=source;
})
}

let attackUse=moves[i]
totalDam+=attackUse.damage
if(maxStun<attackUse.stun){
maxStun=attackUse.stun
}
if(maxPush<attackUse.pushback){
maxPush=attackUse.pushback
}
if(maxStop<attackUse.hitstop){
maxStop=attackUse.hitstop
}
if(attackUse.projectile == false || property.length==0){
property=attackUse.prop
}

position:{

},

grid:{

y: 4
}
})
)


}


let type;
if(player2.stunned==false){
if(player2.currentState!="walkBack" && player2.currentState!="blockstun"){
player2.maxHealth-=totalDam;
player2.takeHit(maxStun, totalDam, player1.direction*maxPush, property)
}
else{
player2.blockHit(maxStun, player1.direction*maxPush)
}
}
else if(player2.stunned==true && player2.currentState=="blockstun" && player2.currentState!="walkBack"){
player2.blockHit(maxStun, maxPush)
}
else if(player2.stunned==true && player2.currentState=="hitstun"){
player2.maxHealth-=totalDam;
player2.takeHit(maxStun, totalDam, player1.direction*maxPush, property)
}
player2.attack=false

}
else{

}
}

class pushBox{
constructor({fighter, offset, color, width, height, prop, logic}){
this.fighter=fighter;
this.realPos;
this.left;
this.right;
this.top;
this.bottom;
this.offset=offset;
this.color=color;
this.width=width;
this.height=height;
this.prop=prop;
this.logic=logic;
}

draw(){
context.fillStyle=this.color;
context.fillRect(this.realPos.x, this.realPos.y-this.height, this.width, this.height)
}
update(){
this.color=this.fighter.color
this.width=this.fighter.width
this.height=this.fighter.height
this.realPos={
x: 0,
y: 0
}

if(this.fighter.direction==1){
this.realPos.x=this.fighter.position.x+(this.fighter.direction*this.offset.x)
}
else{
this.realPos.x=this.fighter.position.x+(this.fighter.direction*this.offset.x)+(this.width*this.fighter.direction)
}
this.realPos.y=this.fighter.position.y-this.offset.y
this.left=this.realPos.x
this.right=this.realPos.x+this.width
this.bottom=this.realPos.y+this.offset.y
this.top=this.realPos.y-this.height

if(this.logic && this.fighter.hitStopped==false){
this.logic()
}
}
}




//HURTBOX CLASS HERE
class hurtBox{
constructor({fighter, offset, width, height, velocity, prop, activation, logic}){
this.fighter=fighter;
this.offset=offset;
this.realPos;
this.width=width;
this.height=height;
this.velocity=velocity;
this.prop=prop;
this.activation=activation;
this.logic=logic;
}
move(){
this.offset.x+=this.velocity.x
this.offset.y+=this.velocity.y
}
//CONTINUE
draw(){
context.fillStyle='rgba(0, 255, 0, 0.3)';
context.strokeStyle="green"
context.lineWidth=3
let hurtX;
let hurtY=this.fighter.position.y-this.offset.y-this.height;
let hurtDir=this.fighter.direction*this.width
hurtX=this.fighter.position.x+(this.fighter.direction*this.offset.x)
context.strokeRect(hurtX, hurtY, hurtDir, this.height)
context.fillRect(hurtX, hurtY, hurtDir, this.height)
}
update(){
this.realPos={
x: 0,
y: 0
}

if(this.fighter.direction==1){
this.realPos.x=this.fighter.position.x+(this.fighter.direction*this.offset.x)
}
else{
this.realPos.x=this.fighter.position.x+(this.fighter.direction*this.offset.x)+(this.width*this.fighter.direction)
}
this.realPos.y=this.fighter.position.y-this.offset.y-this.height;
if(this.logic && this.fighter.hitStopped==false){
this.logic()
}

}

}

class hitbox{
constructor({fighter, offset, width, height, velocity, currentColor, startup, active, recovery, stun, blockstun, meter, meterWhiff, cancelWindow, cancels=[], strengthLevel, scaling=100, damage, pushback, hitstop, prop, type, air=false, projectile=false, connected, activation, logic}){
this.fighter=fighter;
this.offset=offset;
this.realPos;
this.width=width;
this.height=height;
this.velocity=velocity;
this.currentColor=currentColor;
this.startup=startup;
this.active=active;
this.recovery=recovery;
this.stun=stun;
this.blockstun=blockstun;
this.meter=meter;
this.cancelWindow=cancelWindow;
this.cancels=cancels;
this.scaling=scaling;
this.strengthLevel=strengthLevel;
this.damage=damage;
this.pushback=pushback;
this.hitstop=hitstop;
this.prop=prop;
this.type=type
this.air=air
this.projectile=projectile
this.connected=connected
this.activation=activation;
this.logic=logic;
}
move(){
this.offset.x+=this.velocity.x
this.offset.y+=this.velocity.y
}
draw(){
if(this.fighter.framesCurrent>this.startup && this.fighter.framesCurrent<=(this.startup+this.active)){
context.fillStyle='rgba(255, 0, 0, 0.3)';
context.strokeStyle="red"
context.lineWidth=3
let hitX;
let hitY=this.fighter.position.y-this.offset.y-this.height;
let hitDir=this.fighter.direction*this.width
hitX=this.fighter.position.x+(this.fighter.direction*this.offset.x)
context.strokeRect(hitX, hitY, hitDir, this.height)
context.fillRect(hitX, hitY, hitDir, this.height)
}
}
update(){
this.realPos={
x: 0,
y: 0
}
if(this.fighter.direction==1){
this.realPos.x=(this.fighter.position.x)+(this.fighter.direction*this.offset.x)
}
else{
this.realPos.x=(this.fighter.position.x)+(this.fighter.direction*this.offset.x)+(this.width*this.fighter.direction)
}
this.realPos.y=this.fighter.position.y-this.offset.y-this.height;
if(this.logic && this.fighter.hitStopped==false){
this.logic()
}


}

}
//HITBOX CLASS END

class Projectile{
constructor({thrower, target, position, velocity, width, height, duration, framesCurrent=0, hitA=true, hits, hitboxes=[], hurtboxes=[], linger=false, direction, hitStopped, logic}){
this.thrower=thrower;
this.target=target;
this.position=position;
this.velocity=velocity;
this.width=width;
this.height=height;
this.duration=duration;
this.framesCurrent=framesCurrent;
this.hitA=hitA;
this.hits=hits;
this.hitboxes=hitboxes;
this.hurtboxes=hurtboxes;
this.linger=linger;
this.direction=direction;
this.hitStopped=hitStopped
this.logic=logic;
}
draw(){
for(let u=0; u<this.hitboxes.length; u++){
this.hitboxes[u].fighter=this
this.hitboxes[u].direction=this.direction
}
for(let k=0; k<this.hitboxes.length; k++){
this.hitboxes[k].draw()

}
}

update(){
for(let u=0; u<this.hitboxes.length; u++){
this.hitboxes[u].fighter=this
this.hitboxes[u].direction=this.direction
}

this.hitStopped=this.thrower.hitStopped
if(this.hitStopped==false){
this.framesCurrent++
if(this.logic){
this.logic()
}
this.position.x+=this.direction*this.velocity.x
this.position.y+=this.velocity.y

for(let i=0; i<this.hitboxes.length; i++){
if(this.hitboxes[i].connected==true && this.hits>0){
this.hits--
for(let j=0; j<this.hitboxes.length; j++){
this.hitboxes[j].connected=false
}
break
}

}
for(let k=0; k<this.hitboxes.length; k++){
this.hitboxes[k].update()

}

if(this.position.x-(this.direction*this.width)>gameWidth || this.framesCurrent>this.duration || this.hits==0){
let loc=this.thrower.projectiles.indexOf(this)
this.thrower.projectiles.splice(loc, 1)
}


}

}

}

//PROJECTILE CLASS END


class Effect{
constructor({position, sprite, scale, spriteLength, offset={x: 0, y: 0}, direction=1, grid={x: 4, y: 4}}){
this.position=position;
this.sprite=sprite;
this.sprites=[];
this.scale=scale;
this.spriteLength=spriteLength;
this.offset=offset;
this.animFrames=0;
this.direction=direction;
this.grid=grid;
const sheets=[]

}
async loadAnimations(){
const fullStates=[this.sprite]

const promises=fullStates.map(async fullState=>{
this.sprites=await loadAnimation(fullState, this.constructor.name);
console.log(this.sprites)
})

await Promise.all(promises);

}
draw(){
if(this.spriteLength>0 && this.sprites.length>0){

let sheetIndex=Math.floor(this.animFrames/8)

if(this.animFrames>=this.spriteLength){
effects.splice(effects.indexOf(this), 1);
return;
}


sheetIndex=Math.floor(this.animFrames/(this.grid.x*this.grid.y))
const actualFrameX=this.animFrames%this.grid.x
const actualFrameY=Math.floor(this.animFrames/this.grid.y)
if(this.currentState=="crouchMediumPunch") {}
const sheet=this.sprites[sheetIndex];
let scale=this.scale
const off={
x: this.scale*sheet.width/(this.grid.x*2),
y: this.scale*sheet.height/(this.grid.y*2)
}
if(this.offset.x != 0){
off.x=this.offset.x

}
if(this.offset.y != 0){
off.y=this.offset.y

}
context.save()

if(this.direction===-1){

context.scale(-1, 1)


context.drawImage(
      sheet,
      actualFrameX*sheet.width/this.grid.x,
      actualFrameY*sheet.height/this.grid.y,
      sheet.width/this.grid.x,
      sheet.height/this.grid.y,
      -1*(this.position.x+(off.x)),
      this.position.y-off.y,
      sheet.width/this.grid.x * scale,
      sheet.height/this.grid.y * scale)

}
else{
context.drawImage(
      sheet,
      actualFrameX*sheet.width/this.grid.x,
      actualFrameY*sheet.height/this.grid.y,
      sheet.width/this.grid.x,
      sheet.height/this.grid.y,
      this.position.x-off.x,
      this.position.y-off.y,
      sheet.width/this.grid.x * scale,
      sheet.height/this.grid.y * scale)

}

context.restore()  
}
this.animFrames++;  
}
}

prioritise(butCom){

inputTranslator(inputHistory){
let commands;
let lastIn=inputHistory[inputHistory.length-1]
let inputSequence=[]
let justTapped=[]
let punchPressed=false
let kickPressed=false
//CHARGE START

//DIRECTION START
if(this.stunned==false){
if((this.translate(lastIn.direction)==4 || this.translate(lastIn.direction)==1) && this.backCharge<90){
this.backCharge+=1
}
else if((this.translate(lastIn.direction)==4 || this.translate(lastIn.direction)==1) && this.backCharge==90){
this.backCharge=90
}
else if((this.translate(lastIn.direction)!=4 && this.translate(lastIn.direction)!=1) && this.backCharge>=90){
this.backCharge+=1
}
else if((this.translate(lastIn.direction)!=4 && this.translate(lastIn.direction)!=1) && this.backCharge<90){
this.backCharge=0
}

if(this.backCharge>=110 || this.currentState=="forwardDash" || this.currentState=="forwardJump"){
this.backCharge=0
}

//DOWN
if((this.translate(lastIn.direction)==2 || this.translate(lastIn.direction)==1) && this.downCharge<90){
this.downCharge+=1
}
else if((this.translate(lastIn.direction)==2 || this.translate(lastIn.direction)==1) && this.downCharge==90){
this.downCharge=90
}
else if((this.translate(lastIn.direction)!=2 && this.translate(lastIn.direction)!=1) && this.downCharge>=90){
this.downCharge+=1
}
else if((this.translate(lastIn.direction)!=2 && this.translate(lastIn.direction)!=1) && this.downCharge<90){
this.downCharge=0
}

if(this.downCharge>=110 || this.currentState=="forwardDash" || this.currentState=="forwardJump"){
this.downCharge=0
}

}
//DIRECTION END


//CHARGE END
for(let i=0; i<this.followUps.length; i++){
if(this.followUps[i].button==this.prioritise(lastIn.button) && this.followUps[i].exec==false){
this.followUps[i].exec=true
return
}
}


//BEGIN PRIORITY LOOP
if(lastIn.button.length>0){
//1ST LOOP
for(let i=0; i<lastIn.button.length; i++){
if(lastIn.button[i].held==false){
justTapped.push(lastIn.button[i].name)
}
}

//1ST LOOP END
if(justTapped.indexOf("LP") != -1 || justTapped.indexOf("MP") != -1 || justTapped.indexOf("HP") !=-1){
punchPressed="P"
}

if(justTapped.indexOf("LK") != -1 || justTapped.indexOf("MK") != -1 || justTapped.indexOf("HK") !=-1){
kickPressed="K"
}


//1ST LAYER
for(let i=0; i<this.startupInfo.length; i++){
let currentMove=this.startupInfo[i]
let inWin=this.startupInfo[i].window
let inSeq=[];
let cleanSeq=[];
let j=1
let winCheck=0
let inputExecuted=false;
//2ND LAYER
while(j<=inputHistory.length && winCheck<inWin){
if(inputHistory[inputHistory.length-j].direction != 5){
inSeq.unshift(this.translate(inputHistory[inputHistory.length-j].direction))
}
winCheck+=inputHistory[inputHistory.length-j].frameCount
j++
}
//2ND LAYER END
//INPUT CLEANING LAYER
cleanSeq.push(inSeq[0])
for(let k=0; k<inSeq.length; k++){
if(inSeq[k] != cleanSeq[cleanSeq.length-1]){
cleanSeq.push(inSeq[k])
}
}
let stringSeq=cleanSeq.join("")
//INPUT CLEANING LAYER END
//INPUT CHECKING LAYER
for(let l=0; l<currentMove.inputs.length; l++){

back.src="upscaled-sfiii-3s-ken-1080.png"


function animate(){
window.requestAnimationFrame(animate);
frameCount++



updateDirection();
let newLast=history1.length-1
if(history1[newLast].button.length>0){
}


akuma.update();
ken.update();
//DIRECTION SWITCH
if((akuma.position.x+akuma.width/2) > (ken.position.x+ken.width/2)){
if(akuma.direction==1){
akuma.switchSide()
}
if(ken.direction==-1){
ken.switchSide()
}
}

else if((akuma.position.x+akuma.width/2) < (ken.position.x+ken.width/2)){
if(akuma.direction==-1){
akuma.switchSide()
}
if(ken.direction==1){
ken.switchSide()

}
}
//DIRECTION SWITCH END

//PUSH HANDLING START
pushHandler(akuma, ken)
//PUSH HANDLING END

//ATTACK HANDLER START
if(ken.attack==true || akuma.attack==true || ken.projectiles.length>0 || akuma.projectiles.length>0){
attackCollision(akuma, ken)
}
if(maxHitstop>hitstopCount && maxHitstop>0){
hitstopCount++
akuma.hitStopped=true
ken.hitStopped=true
}
else{
hitstopCount=0
maxHitstop=0
akuma.hitStopped=false
ken.hitStopped=false
}

//ATTACK HANDLER END

//Wall Pushback
if((akuma.atWall==true && akuma.currentState=="hitstun" || akuma.atWall==true && akuma.currentState=="blockstun" || akuma.atWall==true && akuma.currentState=="airstun") && akuma.framesCurrent<3 && akuma.hitStopped==false  && ken.hitStopped==false){
ken.position.x+=-1*(akuma.stunFrames.push/3)
}

else if((ken.atWall==true && ken.currentState=="hitstun" || ken.atWall==true && ken.currentState=="blockstun" || ken.atWall==true && ken.currentState=="airstun") && ken.framesCurrent<3  && akuma.hitStopped==false && ken.hitStopped==false){
akuma.position.x+=-1*(ken.stunFrames.push/3)
}
akuma.originalPosition=akuma.pushBox.realPos
ken.originalPosition=ken.pushBox.realPos
//Wall Pushback End

//ZOOM HANDLING
const zoomStartDist=700
const zoomMaxDist=900
const minZoom=1.5
const maxZoom=1.1

let distance=Math.abs(akuma.position.x-ken.position.x)

let targetZoom=minZoom
if(distance>zoomStartDist){
let t=(distance-zoomStartDist)/(zoomMaxDist-zoomStartDist)
t=Math.min(Math.max(t, 0), 1)
targetZoom=minZoom-(minZoom-maxZoom) *t
}

camera.zoom += (targetZoom-camera.zoom) * 0.1

//ZOOM HANDLING END



let viewWidth=screenWidth/camera.zoom
const deadZoneWidth=viewWidth*0.6
let leftPlayer=Math.min(akuma.pushBox.realPos.x+(akuma.pushBox.width/2), ken.pushBox.realPos.x+(ken.pushBox.width/2))
let rightPlayer=Math.max(akuma.pushBox.realPos.x+(akuma.pushBox.width/2), ken.pushBox.realPos.x+(ken.pushBox.width/2))
let gCenter=(leftPlayer+ rightPlayer)/2
let gWidth=rightPlayer-leftPlayer
let camLeft=camera.x
let camRight=camera.x+screenWidth

let deadZoneLeft=camera.x+(viewWidth-deadZoneWidth)/2
let deadZoneRight=deadZoneLeft+deadZoneWidth

if(leftPlayer<deadZoneLeft || rightPlayer>deadZoneRight){

if(gWidth>deadZoneWidth){
let newCenter=gCenter
let targetX=newCenter-viewWidth/2
camera.x+=(targetX-camera.x)*1
}
else{
if(leftPlayer<deadZoneLeft){
camera.x-=deadZoneLeft-leftPlayer
}

if(rightPlayer> deadZoneRight){camera.x+=rightPlayer - deadZoneRight}


}

}
camera.y=gameHeight-screenHeight/camera.zoom

let baseCameraY=ground-canvas.height*0.75
let verticalDeadzoneTop=camera.y+canvas.height*0.25
let highest=Math.min(akuma.pushBox.top, ken.pushBox.top)
//console.log(highest+" vs "+verticalDeadzoneTop)
if(highest<verticalDeadzoneTop){
camera.y-=(verticalDeadzoneTop-highest)
}

camera.x=clamp(camera.x, 0, gameWidth-viewWidth)
context.save()
context.setTransform(
camera.zoom,
0,
0,
camera.zoom,
-camera.x*camera.zoom,
-camera.y*camera.zoom
)

if(maxHitstop==0){
context.fillStyle='gray';
}
else{
context.fillStyle='rgba(58, 58, 58, 1)';
}
context.fillRect(0, 0, screenWidth, screenHeight);
context.drawImage(back, 0, 0, back.width, back.height, 0, 0, 3000, 1600)


akuma.draw()
ken.draw()
if(effects.length>0){
console.log(effects[0].sprites)
for(let k=0; k<effects.length; k++){
effects[k].draw()
}
}
context.restore()
}

async function startGame(){
await Promise.all([
akuma.loadAnimations(),
ken.loadAnimations(),
hitspark.loadAnimations()
])
animate();
}

startGame()
})
</script>
</html>
